; Shared llama-server router settings, applied to every model in models/models.ini.
; `make build` prepends this file to each builder's models/<name>/preset.ini; a
; key set in a model's own section overrides the value here.
;
; These replace the Ollama systemd overrides (OLLAMA_NUM_PARALLEL,
; OLLAMA_FLASH_ATTENTION, OLLAMA_KV_CACHE_TYPE). OLLAMA_MAX_LOADED_MODELS=1 is
; `--models-max 1` on the `make serve` command line, because it belongs to the
; router rather than to a model.

version = 1

[*]
; One slot per model. The server defaults to 4, which splits the KV cache and
; lets concurrent requests share a model, so throughput would depend on load.
parallel = 1
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
; Offload is pinned per model in its builder's LOAD block. --fit would re-size it
; from free VRAM at every load, which makes benchmark runs non-repeatable.
fit = off
n-gpu-layers = 99
; Text only. The vision projectors were not copied, and loading one costs VRAM.
no-mmproj = true
; Read weights into RAM instead of memory-mapping the GGUF. The CPU expert
; layers otherwise live in page cache the kernel can evict. Measured 2026-09-17
; on build 11022: prompt 665 -> 1006 tok/s (gemma), 379 -> 669 (qwen),
; generation unchanged, loads 3 to 10 s slower.
load-mode = none
; Physical batch for prompt processing (server default 512). 1024 took prompt
; to 1565 (gemma) and 1030 (qwen) tok/s with model VRAM +0.1 to 0.2 GiB, which
; keeps the pinned splits. 2048 was faster again but cost 0.5 GiB, which eats
; the spike headroom. lite overrides this to 512 in build-lite.
ubatch-size = 1024
; Put a loaded model to sleep after 10 idle minutes, the old OLLAMA_KEEP_ALIVE=10m.
; Sleeping frees its VRAM (measured 2026-09-15: 6226 MiB down to 242 MiB) and the
; next request wakes it (about 1s for lite). Matters because the service is always on.
sleep-idle-seconds = 600

; The shared sampler baseline, deliberately the SAME for every model. Only
; run-json.py sends sampler options. Every other suite inherits these, so a value
; that differed between models made the leaderboard measure model x sampler: that
; invalidated the 2026-06-14 coding, learning and tutor tables (gemma at
; temperature 0.75 and presence 0.2 against qwen at 0.2 and 0.0). Copied into
; each model's section until 2026-10-09. A builder that defines PARAMS overrides
; these in its own section, which makes it a separate preset: keep it out of
; head-to-head runs.
; Context steps: 262144 131072 65536 32768 16384 8192 4096. 65536 since
; 2026-09-16, matching run-json.py's --num-ctx default and the app contract.
ctx-size = 65536
; Low temperature for strict code syntax and tool tags.
temp = 0.2
top-p = 0.95
top-k = 40
; Keeps structured output on track without narrowing code vocabulary.
min-p = 0.05
; Must stay zero: code reuses exact variable names.
presence-penalty = 0.0
; Stops runaway loops without breaking boilerplate.
repeat-penalty = 1.05
